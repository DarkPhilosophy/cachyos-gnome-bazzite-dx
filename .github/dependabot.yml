version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Every 2 weeks (1st and 15th of the month, 06:00 UTC)
    schedule:
      interval: "cron"
      cronjob: "0 6 1,15 * *"
    # One batched PR for every action update, auto-merged once the image build passes
    groups:
      actions:
        patterns:
          - "*"
