name: Build container image

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - artifacthub-repo.yml
      - .github/dependabot.yml
      - .github/renovate.json5
      - .github/workflows/dependabot-automerge.yml
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - artifacthub-repo.yml
      - .github/dependabot.yml
      - .github/renovate.json5
      - .github/workflows/dependabot-automerge.yml
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  DEFAULT_TAG: latest
  # One upstream Deck image for BOTH flavors. Do not use bazzite-dx-gnome here.
  COMMON_BASE: ghcr.io/ublue-os/bazzite-deck-gnome:stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check for upstream changes
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      packages: read
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      fingerprint: ${{ steps.decide.outputs.fingerprint }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Validate shared architecture
        run: python3 scripts/validate_builds.py

      - name: Decide rebuild as ONE atomic unit
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          BASE: ${{ env.COMMON_BASE }}
        shell: bash
        run: |
          set -euo pipefail
          # Fingerprint errors must fail OPEN (build both) rather than silently
          # treat one stale product as current.
          fingerprint=""
          if base_digest=$(skopeo inspect --no-tags "docker://$BASE" | jq -er .Digest) &&
             kernel=$(curl -fsS "https://copr.fedorainfracloud.org/api_3/package/?ownername=bieszczaders&projectname=kernel-cachyos&packagename=kernel-cachyos&with_latest_succeeded_build=true" | jq -er .builds.latest_succeeded.id) &&
             settings=$(curl -fsS "https://copr.fedorainfracloud.org/api_3/package/?ownername=bieszczaders&projectname=kernel-cachyos-addons&packagename=cachyos-settings&with_latest_succeeded_build=true" | jq -er .builds.latest_succeeded.id); then
            fingerprint=$(printf '%s\n' "$base_digest" "$kernel" "$settings" | sha256sum | cut -c1-32)
          else
            echo "::warning::fingerprint unavailable, rebuilding both"
          fi
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          should_build=true
          if [[ "$EVENT" == schedule && -n "$fingerprint" ]]; then
            should_build=false
            while IFS= read -r image; do
              ref="ghcr.io/${OWNER,,}/${image}:${DEFAULT_TAG}"
              info=$(skopeo inspect --no-tags --creds "${ACTOR}:${TOKEN}" "docker://$ref" 2>/dev/null || true)
              prev=$(jq -r '.Labels["io.darkphilosophy.build-inputs"] // ""' <<<"${info:-{}}" 2>/dev/null || true)
              created=$(jq -r '.Created // ""' <<<"${info:-{}}" 2>/dev/null || true)
              age=9999
              if [[ -n "$created" ]]; then
                timestamp=$(date -d "$created" +%s 2>/dev/null || true)
                if [[ -n "$timestamp" ]]; then
                  age=$(( ($(date +%s) - timestamp) / 86400 ))
                fi
              fi
              echo "$image: previous=$prev expected=$fingerprint age=${age}d"
              if [[ "$prev" != "$fingerprint" || "$age" -ge 14 ]]; then
                should_build=true
              fi
            done < <(jq -r '.[].image' config/variants.json)
          fi
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  build:
    name: Build shared base and two variants
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      FINGERPRINT: ${{ needs.check.outputs.fingerprint }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Mount BTRFS storage
        id: storage
        uses: ublue-os/container-storage-action@911baca08baf30c8654933e9e9723cb399892140
        continue-on-error: true
        with:
          target-dir: /var/lib/containers
          mount-opts: compress-force=zstd:2

      - name: Free space only if BTRFS was unavailable
        if: steps.storage.outcome != 'success'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      # Keep all OCI operations on ONE runner to reuse the shared local image.
      # GitHub shows each step separately in the job details.
      - name: "01 / Build shared CachyOS + DX foundation"
        id: common
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Base image and common packages"
          started=$SECONDS
          sudo podman build --layers --pull=newer \
            --build-arg "BASE_IMAGE=$COMMON_BASE" \
            --label "io.darkphilosophy.shared-stage=$GITHUB_SHA" \
            -f Containerfile.common \
            -t localhost/cachyos-bazzite-common:build .
          common_id=$(sudo podman image inspect localhost/cachyos-bazzite-common:build --format '{{.Id}}')
          test -n "$common_id"
          echo "Common image ID: $common_id"
          echo "::endgroup::"
          echo "seconds=$((SECONDS-started))" >> "$GITHUB_OUTPUT"

      - name: "02 / Build DX desktop image"
        id: dx
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          image=$(jq -er '.[] | select(.flavor == "dx") | .image' config/variants.json)
          sudo podman build --layers --pull=never \
            --build-arg COMMON_IMAGE=localhost/cachyos-bazzite-common:build \
            --build-arg TARGET_FLAVOR=dx \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.title=$image" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$DEFAULT_TAG" \
            --label "io.darkphilosophy.build-inputs=$FINGERPRINT" \
            --label "containers.bootc=1" \
            -f Containerfile -t "localhost/$image:build" .
          sudo podman image exists "localhost/$image:build"
          echo "seconds=$((SECONDS-started))" >> "$GITHUB_OUTPUT"

      - name: "03 / Build Deck + DX Game Mode image"
        id: deck
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          image=$(jq -er '.[] | select(.flavor == "deck") | .image' config/variants.json)
          sudo podman build --layers --pull=never \
            --build-arg COMMON_IMAGE=localhost/cachyos-bazzite-common:build \
            --build-arg TARGET_FLAVOR=deck \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.title=$image" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$DEFAULT_TAG" \
            --label "io.darkphilosophy.build-inputs=$FINGERPRINT" \
            --label "containers.bootc=1" \
            -f Containerfile -t "localhost/$image:build" .
          sudo podman image exists "localhost/$image:build"
          echo "seconds=$((SECONDS-started))" >> "$GITHUB_OUTPUT"

      - name: "04 / Verify shared lineage and RPM contents"
        shell: bash
        run: |
          set -euo pipefail
          for flavor in dx deck; do
            image=$(jq -er --arg flavor "$flavor" '.[] | select(.flavor == $flavor) | .image' config/variants.json)
            ref="localhost/$image:build"
            inherited=$(sudo podman image inspect "$ref" | jq -er '.[0].Labels["io.darkphilosophy.shared-stage"]')
            test "$inherited" = "$GITHUB_SHA"
            sudo podman run --rm --entrypoint /usr/bin/bash "$ref" -c 'rpm -q kernel-cachyos && test -f /etc/pki/containers/darkphilosophy.pub'
            echo "::notice::Verified $flavor from common image revision $GITHUB_SHA"
          done

      - name: "05 / Login to GHCR"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Rootful podman must own its --digestfile. GitHub runner creates files
      # as uid 1001; a sudo process can be denied reopening them in sticky /tmp.
      - name: "06 / Push DX (dated tag)"
        id: push_dx
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          image=$(jq -er '.[] | select(.flavor == "dx") | .image' config/variants.json)
          ref="ghcr.io/${OWNER,,}/$image"
          tag="$(date -u +%Y%m%d)-${GITHUB_SHA:0:12}"
          digest_file=$(sudo mktemp /var/tmp/ghcr-dx-digest.XXXXXXXX)
          trap 'sudo rm -f "$digest_file"' EXIT
          sudo podman tag "localhost/$image:build" "$ref:$tag"
          sudo podman push --digestfile "$digest_file" "$ref:$tag"
          digest=$(sudo cat "$digest_file")
          [[ "$digest" == sha256:* ]] || exit 1
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: "07 / Push Deck (dated tag)"
        id: push_deck
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          image=$(jq -er '.[] | select(.flavor == "deck") | .image' config/variants.json)
          ref="ghcr.io/${OWNER,,}/$image"
          tag="$(date -u +%Y%m%d)-${GITHUB_SHA:0:12}"
          digest_file=$(sudo mktemp /var/tmp/ghcr-deck-digest.XXXXXXXX)
          trap 'sudo rm -f "$digest_file"' EXIT
          sudo podman tag "localhost/$image:build" "$ref:$tag"
          sudo podman push --digestfile "$digest_file" "$ref:$tag"
          digest=$(sudo cat "$digest_file")
          [[ "$digest" == sha256:* ]] || exit 1
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: "08 / Install Cosign"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.1

      - name: "09 / Sign DX digest"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          REF: ${{ steps.push_dx.outputs.ref }}
          DIGEST: ${{ steps.push_dx.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$COSIGN_PRIVATE_KEY"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "$REF@$DIGEST"

      - name: "10 / Sign Deck digest"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          REF: ${{ steps.push_deck.outputs.ref }}
          DIGEST: ${{ steps.push_deck.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$COSIGN_PRIVATE_KEY"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "$REF@$DIGEST"

      - name: "11 / Promote signed DX to latest"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REF: ${{ steps.push_dx.outputs.ref }}
          TAG: ${{ steps.push_dx.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          image=$(jq -er '.[] | select(.flavor == "dx") | .image' config/variants.json)
          sudo podman tag "localhost/$image:build" "$REF:latest"
          sudo podman push "$REF:latest"
          echo "DX promoted: $REF:$TAG -> latest"

      - name: "12 / Promote signed Deck to latest"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REF: ${{ steps.push_deck.outputs.ref }}
          TAG: ${{ steps.push_deck.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          image=$(jq -er '.[] | select(.flavor == "deck") | .image' config/variants.json)
          sudo podman tag "localhost/$image:build" "$REF:latest"
          sudo podman push "$REF:latest"
          echo "Deck promoted: $REF:$TAG -> latest"

      - name: "13 / Build summary"
        if: always()
        shell: bash
        env:
          COMMON_SECS: ${{ steps.common.outputs.seconds }}
          DX_SECS: ${{ steps.dx.outputs.seconds }}
          DECK_SECS: ${{ steps.deck.outputs.seconds }}
          DX_REF: ${{ steps.push_dx.outputs.ref }}
          DX_DIGEST: ${{ steps.push_dx.outputs.digest }}
          DECK_REF: ${{ steps.push_deck.outputs.ref }}
          DECK_DIGEST: ${{ steps.push_deck.outputs.digest }}
        run: |
          {
            echo "## Bazzite DX + Deck build"
            echo ""
            echo "| Stage | Duration |"
            echo "|---|---:|"
            echo "| Shared CachyOS + DX base | ${COMMON_SECS:-not completed}s |"
            echo "| DX desktop delta | ${DX_SECS:-not completed}s |"
            echo "| Deck Game Mode delta | ${DECK_SECS:-not completed}s |"
            echo ""
            echo "Both variants use a single, local common image."
            echo ""
            echo "| Product | Published digest |"
            echo "|---|---|"
            echo "| DX | ${DX_REF:-not published}@${DX_DIGEST:-none} |"
            echo "| Deck | ${DECK_REF:-not published}@${DECK_DIGEST:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"

  build_gate:
    name: Build and push image
    needs: [check, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require shared pipeline success or legitimate up-to-date skip
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SHOULD_BUILD: ${{ needs.check.outputs.should_build }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHECK_RESULT" == success ]] || { echo "Input check failed"; exit 1; }
          if [[ "$SHOULD_BUILD" == false ]]; then
            [[ "$BUILD_RESULT" == skipped ]] || exit 1
          else
            [[ "$BUILD_RESULT" == success ]] || { echo "One or both flavors failed"; exit 1; }
          fi
