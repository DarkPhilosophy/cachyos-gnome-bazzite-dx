name: Build container image

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - artifacthub-repo.yml
      - .github/dependabot.yml
      - .github/renovate.json5
      - .github/workflows/dependabot-automerge.yml
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - artifacthub-repo.yml
      - .github/dependabot.yml
      - .github/renovate.json5
      - .github/workflows/dependabot-automerge.yml
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  DEFAULT_TAG: latest
  # One upstream Deck image for BOTH flavors. Do not use bazzite-dx-gnome here.
  COMMON_BASE: ghcr.io/ublue-os/bazzite-deck-gnome:stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check for upstream changes
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      packages: read
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      fingerprint: ${{ steps.decide.outputs.fingerprint }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Validate shared architecture
        run: python3 scripts/validate_builds.py

      - name: Decide rebuild as ONE atomic unit
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          BASE: ${{ env.COMMON_BASE }}
        shell: bash
        run: |
          set -euo pipefail
          # Fingerprint errors must fail OPEN (build both) rather than silently
          # treat one stale product as current.
          fingerprint=""
          if base_digest=$(skopeo inspect --no-tags "docker://$BASE" | jq -er .Digest) &&
             kernel=$(curl -fsS "https://copr.fedorainfracloud.org/api_3/package/?ownername=bieszczaders&projectname=kernel-cachyos&packagename=kernel-cachyos&with_latest_succeeded_build=true" | jq -er .builds.latest_succeeded.id) &&
             settings=$(curl -fsS "https://copr.fedorainfracloud.org/api_3/package/?ownername=bieszczaders&projectname=kernel-cachyos-addons&packagename=cachyos-settings&with_latest_succeeded_build=true" | jq -er .builds.latest_succeeded.id); then
            fingerprint=$(printf '%s\n' "$base_digest" "$kernel" "$settings" | sha256sum | cut -c1-32)
          else
            echo "::warning::fingerprint unavailable, rebuilding both"
          fi
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          should_build=true
          if [[ "$EVENT" == schedule && -n "$fingerprint" ]]; then
            should_build=false
            while IFS= read -r image; do
              ref="ghcr.io/${OWNER,,}/${image}:${DEFAULT_TAG}"
              info=$(skopeo inspect --no-tags --creds "${ACTOR}:${TOKEN}" "docker://$ref" 2>/dev/null || true)
              prev=$(jq -r '.Labels["io.darkphilosophy.build-inputs"] // ""' <<<"${info:-{}}" 2>/dev/null || true)
              created=$(jq -r '.Created // ""' <<<"${info:-{}}" 2>/dev/null || true)
              age=9999
              if [[ -n "$created" ]]; then
                timestamp=$(date -d "$created" +%s 2>/dev/null || true)
                if [[ -n "$timestamp" ]]; then
                  age=$(( ($(date +%s) - timestamp) / 86400 ))
                fi
              fi
              echo "$image: previous=$prev expected=$fingerprint age=${age}d"
              if [[ "$prev" != "$fingerprint" || "$age" -ge 14 ]]; then
                should_build=true
              fi
            done < <(jq -r '.[].image' config/variants.json)
          fi
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  common:
    name: Build shared CachyOS + DX
    needs: check
    if: needs.check.outputs.should_build == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.publish.outputs.ref }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Prepare BTRFS storage
        uses: ublue-os/container-storage-action@911baca08baf30c8654933e9e9723cb399892140
        with:
          target-dir: /var/lib/containers
          mount-opts: compress-force=zstd:2
      - name: Build the common image once
        run: |
          set -euo pipefail
          sudo podman build --layers --pull=newer \
            --build-arg "BASE_IMAGE=$COMMON_BASE" \
            --label "io.darkphilosophy.shared-stage=$GITHUB_SHA" \
            -f Containerfile.common -t localhost/cachyos-bazzite-common:build .
      - name: Push shared image for DX and Deck jobs
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN required}"
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cachyos-bazzite-common:ci-${GITHUB_SHA:0:12}"
          printf '%s' "$GH_TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          sudo podman tag localhost/cachyos-bazzite-common:build "$ref"
          sudo podman push "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Shared image: $ref" >> "$GITHUB_STEP_SUMMARY"

  dx:
    name: Build and sign DX desktop
    needs: [check, common]
    if: needs.common.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.publish.outputs.ref }}
      digest: ${{ steps.publish.outputs.digest }}
    env:
      FINGERPRINT: ${{ needs.check.outputs.fingerprint }}
      COMMON_REF: ${{ needs.common.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Prepare BTRFS storage
        uses: ublue-os/container-storage-action@911baca08baf30c8654933e9e9723cb399892140
        with:
          target-dir: /var/lib/containers
          mount-opts: compress-force=zstd:2
      - name: Pull shared CachyOS base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          sudo podman pull "$COMMON_REF"
          sudo podman tag "$COMMON_REF" localhost/cachyos-bazzite-common:build
      - name: Build and verify DX desktop
        run: bash scripts/ci-build-flavor.sh dx
      - name: Publish DX candidate
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image=$(jq -er '.[] | select(.flavor == "dx") | .image' config/variants.json)
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$image"
          tag="ci-${GITHUB_SHA:0:12}"
          digest_file=$(sudo mktemp /var/tmp/dx-digest.XXXXXXXX)
          trap 'sudo rm -f "$digest_file"' EXIT
          sudo podman tag "localhost/$image:build" "$ref:$tag"
          sudo podman push --digestfile "$digest_file" "$ref:$tag"
          digest=$(sudo cat "$digest_file")
          [[ "$digest" == sha256:* ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.1
      - name: Sign DX candidate
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          REF: ${{ steps.publish.outputs.ref }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$COSIGN_PRIVATE_KEY"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "$REF@$DIGEST"

  deck:
    name: Build and sign Deck + DX
    needs: [check, common]
    if: needs.common.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.publish.outputs.ref }}
      digest: ${{ steps.publish.outputs.digest }}
    env:
      FINGERPRINT: ${{ needs.check.outputs.fingerprint }}
      COMMON_REF: ${{ needs.common.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Prepare BTRFS storage
        uses: ublue-os/container-storage-action@911baca08baf30c8654933e9e9723cb399892140
        with:
          target-dir: /var/lib/containers
          mount-opts: compress-force=zstd:2
      - name: Pull shared CachyOS base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          sudo podman pull "$COMMON_REF"
          sudo podman tag "$COMMON_REF" localhost/cachyos-bazzite-common:build
      - name: Build and verify Deck Game Mode
        run: bash scripts/ci-build-flavor.sh deck
      - name: Publish Deck candidate
        id: publish
        run: |
          set -euo pipefail
          image=$(jq -er '.[] | select(.flavor == "deck") | .image' config/variants.json)
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$image"
          tag="ci-${GITHUB_SHA:0:12}"
          digest_file=$(sudo mktemp /var/tmp/deck-digest.XXXXXXXX)
          trap 'sudo rm -f "$digest_file"' EXIT
          sudo podman tag "localhost/$image:build" "$ref:$tag"
          sudo podman push --digestfile "$digest_file" "$ref:$tag"
          digest=$(sudo cat "$digest_file")
          [[ "$digest" == sha256:* ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.1
      - name: Sign Deck candidate
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          REF: ${{ steps.publish.outputs.ref }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$COSIGN_PRIVATE_KEY"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "$REF@$DIGEST"

  release:
    name: Publish signed DX and Deck
    needs: [dx, deck]
    if: needs.dx.result == 'success' && needs.deck.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      DX_REF: ${{ needs.dx.outputs.ref }}
      DX_DIGEST: ${{ needs.dx.outputs.digest }}
      DECK_REF: ${{ needs.deck.outputs.ref }}
      DECK_DIGEST: ${{ needs.deck.outputs.digest }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Authenticate to GHCR
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Promote signed DX manifest
        run: |
          set -euo pipefail
          skopeo copy --all --preserve-digests "docker://$DX_REF@$DX_DIGEST" "docker://$DX_REF:latest"
          actual=$(skopeo inspect --raw "docker://$DX_REF:latest" | sha256sum | cut -d' ' -f1)
          [[ "sha256:$actual" == "$DX_DIGEST" ]]
      - name: Promote signed Deck manifest
        run: |
          set -euo pipefail
          skopeo copy --all --preserve-digests "docker://$DECK_REF@$DECK_DIGEST" "docker://$DECK_REF:latest"
          actual=$(skopeo inspect --raw "docker://$DECK_REF:latest" | sha256sum | cut -d' ' -f1)
          [[ "sha256:$actual" == "$DECK_DIGEST" ]]
      - name: Publish summary
        run: |
          {
            echo '## Published Bazzite images'
            echo ''
            echo "| Flavor | Signed digest |"
            echo "|---|---|"
            echo "| DX | `$DX_REF@$DX_DIGEST` |"
            echo "| Deck | `$DECK_REF@$DECK_DIGEST` |"
          } >> "$GITHUB_STEP_SUMMARY"

  pr_smoke:
    name: Validate both images (PR only)
    needs: check
    if: github.event_name == 'pull_request' && needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      FINGERPRINT: ${{ needs.check.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Prepare BTRFS storage
        uses: ublue-os/container-storage-action@911baca08baf30c8654933e9e9723cb399892140
        with:
          target-dir: /var/lib/containers
          mount-opts: compress-force=zstd:2
      - name: Build shared base
        run: |
          sudo podman build --layers --pull=newer \
            --build-arg "BASE_IMAGE=$COMMON_BASE" \
            --label "io.darkphilosophy.shared-stage=$GITHUB_SHA" \
            -f Containerfile.common -t localhost/cachyos-bazzite-common:build .
      - name: Verify DX desktop
        run: bash scripts/ci-build-flavor.sh dx
      - name: Verify Deck Game Mode
        run: bash scripts/ci-build-flavor.sh deck

  build_gate:
    name: Build and push image
    needs: [check, common, dx, deck, release, pr_smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required results
        env:
          CHECK: ${{ needs.check.result }}
          REQUIRED: ${{ needs.check.outputs.should_build }}
          COMMON: ${{ needs.common.result }}
          DX: ${{ needs.dx.result }}
          DECK: ${{ needs.deck.result }}
          RELEASE: ${{ needs.release.result }}
          PR: ${{ needs.pr_smoke.result }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$CHECK" = success
          if [[ "$REQUIRED" == false ]]; then
            echo "No change to publish"; exit 0
          fi
          if [[ "$EVENT" == pull_request ]]; then
            test "$PR" = success
          else
            test "$COMMON" = success
            test "$DX" = success
            test "$DECK" = success
            test "$RELEASE" = success
          fi
