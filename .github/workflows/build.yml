---
name: Build container image
on:
  pull_request:
    branches:
      - main
    # Only rebuild when something that ends up in the image changed
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'artifacthub-repo.yml'
      - '.github/dependabot.yml'
      - '.github/renovate.json5'
      - '.github/workflows/dependabot-automerge.yml'
  schedule:
    # Weekly (Monday 04:17 UTC, off the :00/:05 rush). The check job below skips a
    # variant when neither its base image nor the CachyOS packages changed.
    - cron: '17 4 * * 1'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'artifacthub-repo.yml'
      - '.github/dependabot.yml'
      - '.github/renovate.json5'
      - '.github/workflows/dependabot-automerge.yml'
  workflow_dispatch:

env:
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"  # Put your own image here for a fancy profile on https://artifacthub.io/!
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  # Every image this repo publishes, built in parallel by the `build` job below.
  #   flavor: passed to the Containerfile as TARGET_FLAVOR, picks the per-flavor steps in build.sh
  #   image:  GHCR package name; each variant owns its package, tags and signature
  #   base:   upstream image the variant rebases into the CachyOS kernel
  #   desc:   org.opencontainers.image.description
  # Adding a variant is adding one entry here: nothing else in this workflow is per-image.
  VARIANTS: |
    [
      {"flavor":"dx","image":"cachyos-gnome-bazzite-dx","base":"ghcr.io/ublue-os/bazzite-dx-gnome:stable","desc":"Bazzite-DX (GNOME) with the CachyOS kernel, settings and ksmd"},
      {"flavor":"deck","image":"cachyos-gnome-bazzite-deck","base":"ghcr.io/ublue-os/bazzite-deck-gnome:stable","desc":"Bazzite-Deck (GNOME) with the CachyOS kernel, settings and ksmd"}
    ]

# A newer run on the same ref supersedes an older one instead of burning minutes twice
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ~20 s job that decides, per variant, if a scheduled build is worth ~10 min and several GB of pulls
  check:
    name: Check for upstream changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      # JSON array of the variants to build, consumed as the `build` job's matrix
      matrix: ${{ steps.decide.outputs.matrix }}
      # JSON array of every variant's image name, consumed by `cleanup`
      images: ${{ steps.decide.outputs.images }}
    steps:
      - name: Fingerprint build inputs per variant
        id: fp
        # Fail open: if Copr/ghcr is unreachable the file is missing and Decide builds everything
        continue-on-error: true
        env:
          VARIANTS: ${{ env.VARIANTS }}
        run: |
          set -euo pipefail
          copr() {
            curl -fsS "https://copr.fedorainfracloud.org/api_3/package/?ownername=bieszczaders&projectname=$1&packagename=$2&with_latest_succeeded_build=true" \
              | jq -er .builds.latest_succeeded.id
          }
          # Both CachyOS inputs are shared by every variant
          kernel=$(copr kernel-cachyos kernel-cachyos)
          settings=$(copr kernel-cachyos-addons cachyos-settings)
          out='[]'
          count=$(jq 'length' <<<"${VARIANTS}")
          for ((i = 0; i < count; i++)); do
            item=$(jq -c ".[${i}]" <<<"${VARIANTS}")
            base=$(jq -r '.base' <<<"${item}")
            digest=$(skopeo inspect --no-tags "docker://${base}" | jq -r .Digest)
            fingerprint=$(printf '%s\n' "${digest}" "${kernel}" "${settings}" | sha256sum | cut -c1-32)
            echo "$(jq -r '.image' <<<"${item}"): base=${digest} kernel-build=${kernel} settings-build=${settings} fingerprint=${fingerprint}"
            out=$(jq -c --argjson v "${item}" --arg d "${digest}" --arg f "${fingerprint}" '. + [$v + {base_digest: $d, fingerprint: $f}]' <<<"${out}")
          done
          printf '%s\n' "${out}" > "${RUNNER_TEMP}/variants.json"

      - name: Decide which variants to build
        id: decide
        env:
          VARIANTS: ${{ env.VARIANTS }}
          EVENT: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ github.token }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/variants.json"
          if [ ! -s "${src}" ]; then
            echo "::warning::build-input fingerprint unavailable, building every variant"
            printf '%s\n' "${VARIANTS}" | jq -c 'map(. + {fingerprint: ""})' > "${src}"
          fi
          matrix='[]'
          count=$(jq 'length' "${src}")
          if [ "${count}" -eq 0 ]; then
            echo "::error::VARIANTS is empty, no image would be built" >&2
            exit 1
          fi
          for ((i = 0; i < count; i++)); do
            v=$(jq -c ".[${i}]" "${src}")
            image=$(jq -r '.image' <<<"${v}")
            fp=$(jq -r '.fingerprint // ""' <<<"${v}")
            build=true
            age=9999
            # Every event except the schedule builds every variant: PRs must be validated
            if [ "${EVENT}" = "schedule" ] && [ -n "${fp}" ]; then
              repo="ghcr.io/${OWNER,,}/${image}:${DEFAULT_TAG}"
              info=$(skopeo inspect --no-tags --creds "${GITHUB_ACTOR}:${TOKEN}" "docker://${repo}" 2>/dev/null || true)
              prev=$(jq -r '.Labels["io.darkphilosophy.build-inputs"] // ""' <<<"${info:-{\}}")
              created=$(jq -r '.Created // ""' <<<"${info:-{\}}")
              [ -n "${created}" ] && age=$(( ( $(date +%s) - $(date -d "$created" +%s) ) / 86400 ))
              echo "${image}: previous=${prev} current=${fp} image-age-days=${age}"
              # Third-party repos (crowdsec, netbird, google-cloud, Sunshine, ...) are not
              # fingerprinted, so never let an image get older than 14 days.
              if [ "${prev}" = "${fp}" ] && [ "${age}" -lt 14 ]; then build=false; fi
            fi
            if [ "${build}" = true ]; then
              matrix=$(jq -c --argjson v "${v}" '. + [$v]' <<<"${matrix}")
              echo "::notice::${image}: building"
            else
              echo "::notice::${image}: inputs unchanged and image is ${age}d old, skipping"
            fi
          done
          printf 'matrix=%s\n' "$(jq -c . <<<"${matrix}")" >>"${GITHUB_OUTPUT}"
          printf 'images=%s\n' "$(jq -c '[.[].image]' "${src}")" >>"${GITHUB_OUTPUT}"

  # One leg per variant; they run at the same time and never share a package or a tag
  build:
    name: Build and push image (${{ matrix.variant.flavor }})
    needs: check
    if: needs.check.outputs.matrix != '[]' && needs.check.outputs.matrix != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.check.outputs.matrix) }}
    steps:
      - name: Prepare environment
        env:
          VARIANT_IMAGE: ${{ matrix.variant.image }}
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${VARIANT_IMAGE,,}" >> "${GITHUB_ENV}"

      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # You only use this action if the container-storage-action proves to be unreliable, you don't need to enable both
      # This is optional, but if you see that your builds are way too big for the runners, you can enable this by uncommenting the following lines:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Mount BTRFS for podman storage
        id: container-storage-action
        uses: ublue-os/container-storage-action@911baca08baf30c8654933e9e9723cb399892140

        # Fallback to the remove-unwanted-software-action if github doesn't allocate enough space
        # See: https://github.com/ublue-os/container-storage-action/pull/11
        continue-on-error: true 
        with:
          target-dir: /var/lib/containers
          mount-opts: compress-force=zstd:2

      - name: Get current date
        id: date
        run: |
          # This generates a timestamp like what is defined on the ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      # Image metadata for https://artifacthub.io/ - This is optional but is highly recommended so we all can get a index of all the custom images
      # The metadata by itself is not going to do anything, you choose if you want your image to be on ArtifactHub or not.
      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          # This generates all the tags for your image, you can add custom tags here too!
          # Default tags are "$DEFAULT_TAG" and "$DEFAULT_TAG.$date".
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ matrix.variant.desc }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
            io.darkphilosophy.build-inputs=${{ matrix.variant.fingerprint }}
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v2
        with:
          containerfiles: |
            ./Containerfile
          # The variant decides the base image and the per-flavor steps in build.sh
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ matrix.variant.base }}
            TARGET_FLAVOR=${{ matrix.variant.flavor }}
          oci: false

      # Rechunk is a script that we use on Universal Blue to make sure there isnt a single huge layer when your image gets published.
      # This does not make your image faster to download, just provides better resumability and fixes a few errors.
      # Documentation for Rechunk is provided on their github repository at https://github.com/hhd-dev/rechunk
      # You can enable it by uncommenting the following lines:
      # - name: Run Rechunker
      #   id: rechunk
      #   uses: ublue-os/legacy-rechunk@a925083d9af7cb04b3e2a6e8c01bfa495f38b710 # v1.0.0
      #   with:
      #     rechunk: 'ghcr.io/ublue-os/legacy-rechunk:v1.0.0-x86_64'
      #     ref: "localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"
      #     prev-ref: "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"
      #     skip_compression: true
      #     version: ${{ env.CENTOS_VERSION }}
      #     labels: ${{ steps.metadata.outputs.labels }} # Rechunk strips out all the labels during build, this needs to be reapplied here with newline separator

      # This is necessary so that the podman socket can find the rechunked image on its storage
      # - name: Load in podman and tag
      #   run: |
      #     IMAGE=$(podman pull ${{ steps.rechunk.outputs.ref }})
      #     sudo rm -rf ${{ steps.rechunk.outputs.output }}
      #     for tag in ${{ steps.metadata.outputs.tags }}; do
      #       podman tag $IMAGE ${{ env.IMAGE_NAME }}:$tag
      #     done

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v3
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          cosign-release: 'v2.6.1'

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          # One signature on the digest covers every tag; signing each tag re-signs the same manifest
          # Each variant signs its own digest with the same key, under its own package
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          [ -n "$DIGEST" ] || { echo "push step returned no digest" >&2; exit 1; }
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "$IMAGE_FULL@$DIGEST"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

  # Branch protection requires the check named "Build and push image". A matrix job is
  # reported per leg ("Build and push image (dx)"), so this gate keeps that exact name and
  # fails whenever any variant's leg did not succeed.
  build_gate:
    name: Build and push image
    needs:
      - check
      - build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every variant to be built
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "check=${CHECK_RESULT} build=${BUILD_RESULT}"
          case "${CHECK_RESULT}" in
            success) ;;
            *) echo "::error::upstream change check did not succeed"; exit 1 ;;
          esac
          # skipped means every variant was up to date, which is a pass
          case "${BUILD_RESULT}" in
            success | skipped) ;;
            *) echo "::error::one or more variants failed to build"; exit 1 ;;
          esac

  # Keeps the registry small: drops untagged leftovers of earlier builds.
  # Tagged versions (images and their .sig signatures) are never touched.
  cleanup:
    name: Prune old untagged image versions
    needs:
      - check
      - build_gate
    if: needs.build_gate.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.check.outputs.images) }}
    steps:
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true
