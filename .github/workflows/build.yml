name: Build container image

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - artifacthub-repo.yml
      - .github/dependabot.yml
      - .github/renovate.json5
      - .github/workflows/dependabot-automerge.yml
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - artifacthub-repo.yml
      - .github/dependabot.yml
      - .github/renovate.json5
      - .github/workflows/dependabot-automerge.yml
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  DEFAULT_TAG: latest
  # One upstream Deck image for BOTH flavors. Do not use bazzite-dx-gnome here.
  COMMON_BASE: ghcr.io/ublue-os/bazzite-deck-gnome:stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check for upstream changes
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      packages: read
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      fingerprint: ${{ steps.decide.outputs.fingerprint }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Validate shared architecture
        run: python3 scripts/validate_builds.py

      - name: Decide rebuild as ONE atomic unit
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          BASE: ${{ env.COMMON_BASE }}
        shell: bash
        run: |
          set -euo pipefail
          # Fingerprint errors must fail OPEN (build both) rather than silently
          # treat one stale product as current.
          fingerprint=""
          if base_digest=$(skopeo inspect --no-tags "docker://$BASE" | jq -er .Digest) &&
             kernel=$(curl -fsS "https://copr.fedorainfracloud.org/api_3/package/?ownername=bieszczaders&projectname=kernel-cachyos&packagename=kernel-cachyos&with_latest_succeeded_build=true" | jq -er .builds.latest_succeeded.id) &&
             settings=$(curl -fsS "https://copr.fedorainfracloud.org/api_3/package/?ownername=bieszczaders&projectname=kernel-cachyos-addons&packagename=cachyos-settings&with_latest_succeeded_build=true" | jq -er .builds.latest_succeeded.id); then
            fingerprint=$(printf '%s\n' "$base_digest" "$kernel" "$settings" | sha256sum | cut -c1-32)
          else
            echo "::warning::fingerprint unavailable, rebuilding both"
          fi
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          should_build=true
          if [[ "$EVENT" == schedule && -n "$fingerprint" ]]; then
            should_build=false
            while IFS= read -r image; do
              ref="ghcr.io/${OWNER,,}/${image}:${DEFAULT_TAG}"
              info=$(skopeo inspect --no-tags --creds "${ACTOR}:${TOKEN}" "docker://$ref" 2>/dev/null || true)
              prev=$(jq -r '.Labels["io.darkphilosophy.build-inputs"] // ""' <<<"${info:-{}}" 2>/dev/null || true)
              created=$(jq -r '.Created // ""' <<<"${info:-{}}" 2>/dev/null || true)
              age=9999
              if [[ -n "$created" ]]; then
                timestamp=$(date -d "$created" +%s 2>/dev/null || true)
                if [[ -n "$timestamp" ]]; then
                  age=$(( ($(date +%s) - timestamp) / 86400 ))
                fi
              fi
              echo "$image: previous=$prev expected=$fingerprint age=${age}d"
              if [[ "$prev" != "$fingerprint" || "$age" -ge 14 ]]; then
                should_build=true
              fi
            done < <(jq -r '.[].image' config/variants.json)
          fi
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  build:
    name: Build shared base and two variants
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      FINGERPRINT: ${{ needs.check.outputs.fingerprint }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Mount BTRFS storage
        id: storage
        uses: ublue-os/container-storage-action@911baca08baf30c8654933e9e9723cb399892140
        continue-on-error: true
        with:
          target-dir: /var/lib/containers
          mount-opts: compress-force=zstd:2

      - name: Free space only if BTRFS was unavailable
        if: steps.storage.outcome != 'success'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Build common + DX + Deck (once, one runner)
        shell: bash
        run: |
          set -euo pipefail
          # Rootful podman uses the BTRFS storage mounted above. Both final
          # builds share the SAME locally committed base; no second pull,
          # no second CachyOS kernel or initramfs generation.
          sudo podman build --layers --pull=newer \
            --build-arg "BASE_IMAGE=$COMMON_BASE" \
            --label "io.darkphilosophy.shared-stage=$GITHUB_SHA" \
            -f Containerfile.common \
            -t localhost/cachyos-bazzite-common:build .
          common_id=$(sudo podman image inspect localhost/cachyos-bazzite-common:build --format '{{.Id}}')
          test -n "$common_id"
          echo "Shared stage image ID: $common_id"
          while IFS=$'\t' read -r flavor image; do
            echo "::group::Build $flavor from same shared image"
            sudo podman build --layers --pull=never \
              --build-arg "COMMON_IMAGE=localhost/cachyos-bazzite-common:build" \
              --build-arg "TARGET_FLAVOR=$flavor" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.title=$image" \
              --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.version=$DEFAULT_TAG" \
              --label "io.darkphilosophy.build-inputs=$FINGERPRINT" \
              --label "containers.bootc=1" \
              -f Containerfile -t "localhost/$image:build" .
            sudo podman image exists "localhost/$image:build"
            echo "::endgroup::"
          done < <(jq -r '.[] | [.flavor,.image] | @tsv' config/variants.json)

      - name: Verify inherited shared stage and final flavors
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          for flavor in dx deck; do
            ref="localhost/cachyos-gnome-bazzite-$flavor:build"
            inherited=$(sudo podman image inspect "$ref" | jq -er '.[0].Labels["io.darkphilosophy.shared-stage"]')
            test "$inherited" = "$expected"
            sudo podman run --rm --entrypoint /usr/bin/bash "$ref" -c 'rpm -q kernel-cachyos && test -f /etc/pki/containers/darkphilosophy.pub'
          done

      - name: Login to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          printf '%s' "$TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push both verified products
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: push
        shell: bash
        run: |
          set -euo pipefail
          : > digests.tsv
          today=$(date -u +%Y%m%d)
          while IFS=$'\t' read -r flavor image; do
            ref="ghcr.io/${OWNER,,}/$image"
            sudo podman tag "localhost/$image:build" "$ref:$today"
            digest_file=$(mktemp)
            sudo podman push --digestfile "$digest_file" "$ref:$today"
            digest=$(cat "$digest_file")
            rm -f "$digest_file"
            [[ "$digest" == sha256:* ]]
            printf '%s\t%s\n' "$ref" "$digest" >> digests.tsv
            echo "Pushed immutable date tag $ref:$today => $digest"
          done < <(jq -r '.[] | [.flavor,.image] | @tsv' config/variants.json)

      - name: Setup Cosign
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.1

      - name: Sign BOTH image digests before advancing latest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$COSIGN_PRIVATE_KEY"
          while IFS=$'\t' read -r ref digest; do
            cosign sign -y --key env://COSIGN_PRIVATE_KEY "$ref@$digest"
            echo "Signed $ref@$digest"
          done < digests.tsv

      - name: Promote signed images to latest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          # The two packages are independently tagged, but neither is moved
          # to latest until BOTH builds and BOTH digest signatures pass.
          while IFS=$'\t' read -r ref digest; do
            sudo podman tag "localhost/${ref##*/}:build" "$ref:latest"
            sudo podman push "$ref:latest"
            echo "Promoted signed $ref@$digest to latest"
          done < digests.tsv

  build_gate:
    name: Build and push image
    needs: [check, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require shared pipeline success or legitimate up-to-date skip
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SHOULD_BUILD: ${{ needs.check.outputs.should_build }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHECK_RESULT" == success ]] || { echo "Input check failed"; exit 1; }
          if [[ "$SHOULD_BUILD" == false ]]; then
            [[ "$BUILD_RESULT" == skipped ]] || exit 1
          else
            [[ "$BUILD_RESULT" == success ]] || { echo "One or both flavors failed"; exit 1; }
          fi
