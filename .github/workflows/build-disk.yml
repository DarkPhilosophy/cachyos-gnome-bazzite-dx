name: Build disk images

on:
  pull_request:
    branches: [main]
    paths:
      - 'disk_config/**'
      - 'config/variants.json'
      - 'scripts/validate_builds.py'
      - '.github/workflows/build-disk.yml'
      - 'Justfile'
  workflow_dispatch:
    inputs:
      variant:
        description: Image to build
        type: choice
        required: true
        default: all
        options: [all, dx, deck]
      artifact:
        description: Artifact format
        type: choice
        required: true
        default: all
        options: [all, qcow2, anaconda-iso]
      tag:
        description: Published GHCR image tag (must exist; defaults to latest)
        required: true
        default: latest
        type: string
      upload-to-s3:
        description: Upload to S3 instead of Actions artifacts
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate disk build inputs
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Verify configurations and generate matrix
        id: plan
        env:
          VARIANT: ${{ inputs.variant || 'all' }}
          ARTIFACT: ${{ inputs.artifact || 'all' }}
          IMAGE_TAG: ${{ inputs.tag || 'latest' }}
        run: |
          set -euo pipefail
          python3 scripts/validate_builds.py --variant "$VARIANT" --artifact "$ARTIFACT" --tag "$IMAGE_TAG"
          echo "matrix=$(python3 scripts/validate_builds.py --matrix --variant "$VARIANT" --artifact "$ARTIFACT" --tag "$IMAGE_TAG")" >> "$GITHUB_OUTPUT"

  build:
    name: Disk ${{ matrix.target.flavor }} / ${{ matrix.target.type }}
    needs: validate
    # PRs validate configs only: they cannot use yet-unpublished :latest images.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: ${{ fromJSON(needs.validate.outputs.matrix) }}
    env:
      IMAGE_TAG: ${{ inputs.tag }}
      OWNER: ${{ github.repository_owner }}
      S3_UPLOAD: ${{ inputs.upload-to-s3 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Free build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Resolve and verify published container
        id: ref
        env:
          IMAGE_NAME: ${{ matrix.target.image }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Building ${{ matrix.target.type }} from $image"
          # Fail early: never silently fall back to a different package or :latest.
          sudo podman pull "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Build disk image / installer ISO
        id: build
        uses: osbuild/bootc-image-builder-action@main
        with:
          builder-image: ghcr.io/lorbuschris/bootc-image-builder:20250608
          config-file: ${{ matrix.target.config }}
          image: ${{ steps.ref.outputs.image }}
          types: ${{ matrix.target.type }}
          additional-args: --use-librepo=True

      - name: Checksum generated artifacts
        env:
          OUTPUT: ${{ steps.build.outputs.output-directory }}
        run: |
          set -euo pipefail
          test -d "$OUTPUT"
          find "$OUTPUT" -type f -size +0c -print -quit | grep -q .
          find "$OUTPUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > "$OUTPUT/SHA256SUMS"
          test -s "$OUTPUT/SHA256SUMS"

      - name: Upload artifacts to GitHub
        if: inputs.upload-to-s3 != true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazzite-${{ matrix.target.flavor }}-${{ matrix.target.type }}-${{ github.run_id }}
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Install rclone for optional S3 upload
        if: inputs.upload-to-s3 == true
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Upload artifacts to S3
        if: inputs.upload-to-s3 == true
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
          SOURCE: ${{ steps.build.outputs.output-directory }}
        run: |
          set -euo pipefail
          : "${S3_BUCKET:?S3_BUCKET_NAME secret required}"
          rclone copy "$SOURCE" "S3:${S3_BUCKET}/${{ matrix.target.flavor }}/${{ matrix.target.type }}/${{ github.run_id }}/"
